<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A1020">
<title>Offline · Gaffster</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A1020; color: #F5F7FF; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 20px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; }
  p { margin: 0; color: #A9B4D0; max-width: 340px; line-height: 1.5; }
  button { margin-top: 8px; background: #C8FF3D; color: #0A1020; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/brand/icon-192.png" alt="Gaffster">
  <h1>You're offline</h1>
  <p>Gaffster needs an internet connection to load squads and make images. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
